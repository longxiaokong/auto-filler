<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="manifest.type" content="options_page" />
  <title>Auto Filler - 设置</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="card">
    <h1 class="title">Auto Filler 设置</h1>

    <!-- Text Fields -->
    <section class="section">
      <h2 class="section-title">文本字段</h2>
      <div id="textFieldList" class="text-field-list"></div>
      <button id="addFieldBtn" class="btn-secondary">+ 添加字段</button>
    </section>

    <!-- File Records -->
    <section class="section">
      <h2 class="section-title">文件管理</h2>
      <div class="file-upload">
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.md,.txt,.xlsx,.xls,.pptx,.ppt,.csv,.jpg,.jpeg,.png,.gif,.bmp,.webp,.html,.json" />
        <input type="text" id="fileDesc" placeholder="文件描述" />
        <button id="uploadBtn" class="btn-secondary">上传</button>
      </div>
      <div id="fileList" class="file-list"></div>
    </section>

    <!-- API Config -->
    <section class="section">
      <h2 class="section-title">API 配置</h2>
      <div class="form-group">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
      </div>
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="请输入 API Key" />
      </div>
      <div class="form-group">
        <label for="model">模型名称</label>
        <input type="text" id="model" placeholder="例如 gpt-4o-mini" />
      </div>
    </section>

    <!-- Save -->
    <div class="actions">
      <button id="saveBtn" class="btn-primary">保存</button>
      <span id="statusMsg" class="status-msg"></span>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
