<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="manifest.type" content="options_page" />
  <title>Auto Filler - 设置</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="card">
    <h1 class="title">Auto Filler 设置</h1>

    <!-- Profile Type -->
    <section class="section">
      <h2 class="section-title">人员类型</h2>
      <select id="profileType">
        <option value="general">普通</option>
        <option value="student">学生</option>
        <option value="civil_servant">公务员</option>
      </select>
    </section>

    <!-- Basic Fields -->
    <section class="section">
      <h2 class="section-title">基本信息</h2>
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" placeholder="请输入姓名" />
      </div>
      <div class="form-group">
        <label for="gender">性别</label>
        <select id="gender">
          <option value="">请选择</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="form-group">
        <label for="idNumber">身份证号</label>
        <input type="text" id="idNumber" placeholder="请输入身份证号" />
      </div>
      <div class="form-group">
        <label for="phone">手机号</label>
        <input type="text" id="phone" placeholder="请输入手机号" />
      </div>
      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="请输入邮箱" />
      </div>
      <div class="form-group">
        <label for="address">地址</label>
        <input type="text" id="address" placeholder="请输入地址" />
      </div>
    </section>

    <!-- Student Fields -->
    <section id="studentFields" class="section hidden">
      <h2 class="section-title">学生信息</h2>
      <div class="form-group">
        <label for="school">学校</label>
        <input type="text" id="school" placeholder="请输入学校" />
      </div>
      <div class="form-group">
        <label for="major">专业</label>
        <input type="text" id="major" placeholder="请输入专业" />
      </div>
      <div class="form-group">
        <label for="studentId">学号</label>
        <input type="text" id="studentId" placeholder="请输入学号" />
      </div>
      <div class="form-group">
        <label for="degree">学历</label>
        <select id="degree">
          <option value="">请选择</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
          <option value="博士">博士</option>
        </select>
      </div>
      <div class="form-group">
        <label for="gpa">GPA</label>
        <input type="text" id="gpa" placeholder="请输入 GPA" />
      </div>
      <div class="form-group">
        <label for="enrollmentYear">入学年份</label>
        <input type="text" id="enrollmentYear" placeholder="例如 2022" />
      </div>
    </section>

    <!-- Civil Servant Fields -->
    <section id="civilServantFields" class="section hidden">
      <h2 class="section-title">公务员信息</h2>
      <div class="form-group">
        <label for="employeeId">工号</label>
        <input type="text" id="employeeId" placeholder="请输入工号" />
      </div>
      <div class="form-group">
        <label for="department">部门</label>
        <input type="text" id="department" placeholder="请输入部门" />
      </div>
      <div class="form-group">
        <label for="position">职务</label>
        <input type="text" id="position" placeholder="请输入职务" />
      </div>
      <div class="form-group">
        <label for="rank">职级</label>
        <input type="text" id="rank" placeholder="请输入职级" />
      </div>
    </section>

    <!-- API Config -->
    <section class="section">
      <h2 class="section-title">API 配置</h2>
      <div class="form-group">
        <label for="baseUrl">Base URL</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" />
      </div>
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="请输入 API Key" />
      </div>
      <div class="form-group">
        <label for="model">模型名称</label>
        <input type="text" id="model" placeholder="例如 gpt-4o-mini" />
      </div>
    </section>

    <!-- Save -->
    <div class="actions">
      <button id="saveBtn" class="btn-primary">保存</button>
      <span id="statusMsg" class="status-msg"></span>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
