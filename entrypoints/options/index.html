<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="manifest.type" content="options_page" />
  <meta name="manifest.options_ui.open_in_tab" content="true" />
  <title>秒填鸭 - 工作台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="brand-icon" src="/logo.png" alt="秒填鸭" />
        <span class="brand-text">秒填鸭</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <a class="nav-item active" data-page="profile" href="#">首页</a>
        <a class="nav-item" data-page="certificates" href="#">证书材料</a>
        <a class="nav-item" data-page="autofill" href="#">自动填表</a>
        <a class="nav-item" data-page="docfill" href="#">文档填充</a>
        <a class="nav-item" data-page="pdf" href="#">PDF 汇总</a>
        <a class="nav-item" data-page="settings" href="#">设置</a>
      </nav>
    </aside>

    <main class="content">
      <header class="content-header" id="contentHeader">
        <div class="header-titles">
          <h1 id="pageTitle">首页</h1>
          <p class="subtitle" id="pageSubtitle"></p>
        </div>
        <div class="header-actions">
          <button class="member-btn">会员</button>
          <button class="icon-btn" title="通知">🔔</button>
          <button class="icon-btn avatar" title="用户">👤</button>
        </div>
      </header>

      <div class="page-content" id="pageContent"></div>
    </main>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
